[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "mypy-extensions>=1.1.0",
  "mypy>=1.19.0",
  "prompt_toolkit>=3.0.41",
  "setuptools>=80.0.0",
  "types-regex",
  "types-setuptools",
  "wheel>=0.45.0",
]

[project]
name = "xulbux"
version = "1.9.8"
description = "A Python library to simplify common programming tasks."
readme = "README.md"
authors = [{ name = "XulbuX", email = "xulbux.real@gmail.com" }]
maintainers = [{ name = "XulbuX", email = "xulbux.real@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.0"
dependencies = [
  "prompt_toolkit>=3.0.41",
  "regex>=2023.10.3",
  "typing-extensions>=4.6.0; python_version < '3.13'",
]
optional-dependencies = { dev = [
  "pyright>=1.1.408",
  "pytest>=7.4.2",
  "ruff>=0.9.0",
] }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "args",
  "arguments",
  "attributes",
  "classes",
  "client",
  "cmd",
  "code",
  "codes",
  "color",
  "commands",
  "console",
  "constants",
  "consts",
  "conversion",
  "convert",
  "data",
  "debug",
  "easier",
  "env",
  "environment",
  "error",
  "file",
  "format",
  "formatting",
  "functions",
  "helper",
  "hex",
  "hexa",
  "hsl",
  "hsla",
  "info",
  "input",
  "json",
  "library",
  "log",
  "logging",
  "methods",
  "nice",
  "operations",
  "path",
  "presets",
  "pretty",
  "printing",
  "properties",
  "python",
  "re",
  "regex",
  "rgb",
  "rgba",
  "string",
  "structures",
  "system",
  "tools",
  "types",
  "utility",
  "warn",
  "warning",
  "xulbux",
]

[project.urls]
"Bug Reports" = "https://github.com/xulbux/python-lib-xulbux/issues"
"Changelog" = "https://github.com/xulbux/python-lib-xulbux/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/xulbux/python-lib-xulbux/wiki"
"Homepage" = "https://github.com/xulbux/python-lib-xulbux"
"License" = "https://github.com/xulbux/python-lib-xulbux/blob/main/LICENSE"
"Source Code" = "https://github.com/xulbux/python-lib-xulbux/tree/main/src"
"Stats" = "https://clickpy.clickhouse.com/dashboard/xulbux"

[project.scripts]
xulbux-lib = "xulbux.cli:main"

[tool.mypy]
exclude = ["^assets/", "^build/"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
  ".github",
  ".mypy_cache",
  ".pytest_cache",
  ".venv",
  "**/__pycache__",
  "assets",
  "build",
]
reportDeprecated = "none"
reportPrivateUsage = "none"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra -q"
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests/test_*.py"]

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90", # mccabe complexity
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort (import sorting)
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = ["E203", "E266", "E501", "RUF002"]
mccabe = { max-complexity = 12 }

[tool.ruff.lint.isort]
section-order = [
  "future",
  "local-folder",
  "standard-library",
  "first-party",
  "third-party",
]
no-lines-before = ["first-party", "third-party"]

[tool.ruff.lint.per-file-ignores]
"src/xulbux/base/types.py" = ["E302", "E305"]
"src/xulbux/cli/help.py" = ["E501"]
"__init__.py" = ["F403", "F405"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
xulbux = ["*.pyi", "**/*.pyi", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

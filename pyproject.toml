[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "mypy-extensions>=1.1.0",
  "mypy>=1.19.0",
  "prompt_toolkit>=3.0.41",
  "ruff>=0.15.0",
  "setuptools>=80.0.0",
  "types-regex",
  "types-setuptools",
  "wheel>=0.45.0",
]

[project]
name = "xulbux"
version = "2.0.0"
description = "A Python library to simplify common programming tasks."
readme = "README.md"
authors = [{ name = "XulbuX", email = "hi@xul.is" }]
maintainers = [{ name = "XulbuX", email = "hi@xul.is" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.0"
dependencies = [
  "prompt_toolkit>=3.0.41",
  "regex>=2023.10.3",
  "typing-extensions>=4.10.0; python_version < '3.13'",
]
optional-dependencies = { dev = [
  "pyright>=1.1.411",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.16",
] }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "color",
  "console",
  "data-structures",
  "file-system",
  "formatting",
  "string-manipulation",
  "styling",
  "utility",
]

[project.urls]
"Bug Reports" = "https://github.com/xulbux/python-lib-xulbux/issues"
"Changelog" = "https://github.com/xulbux/python-lib-xulbux/blob/main/CHANGELOG.md"
"Documentation" = "https://xulbux.github.io/python-lib-xulbux/docs"
"Homepage" = "https://xulbux.github.io/python-lib-xulbux"
"License" = "https://github.com/xulbux/python-lib-xulbux/blob/main/LICENSE"
"Source Code" = "https://github.com/xulbux/python-lib-xulbux/tree/main/src"
"Stats" = "https://clickpy.clickhouse.com/dashboard/xulbux"

[project.scripts]
xulbux-lib = "xulbux.cli:main"

[tool.coverage.report]
exclude_lines = [
  "@overload",
  "#\\s+coverage:ignore\\[.*\\]", # coverage:ignore[reason]
  "def __repr__",
  "if __name__ == .__main__.:",
  "if self.debug:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.run]
branch = true
source = ["src/xulbux"]
omit = ["src/xulbux/format_codes.py"]

[tool.mypy]
exclude_gitignore = true

[tool.pyright]
typeCheckingMode = "strict"
reportDeprecated = "warning"
reportPrivateUsage = "none"
include = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q --cov=xulbux --cov-report=term-missing --cov-fail-under=100"
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
preview = true
line-length = 127
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear (finds likely bugs & design problems)
  "C4",  # flake8-comprehensions (helps write better comprehensions)
  "C90", # mccabe complexity (checks cyclomatic complexity)
  "E",   # pycodestyle errors (checks PEP 8 style errors)
  "F",   # pyflakes (checks for logical errors)
  "I",   # isort (sorts imports)
  "RUF", # Ruff-specific linting rules
  "SIM", # flake8-simplify (helps simplify code)
  "TCH", # flake8-type-checking (manages type-checking imports)
  "UP",  # pyupgrade (upgrades syntax for newer Python versions)
  "W",   # pycodestyle warnings (checks PEP 8 style warnings)
]
ignore = ["ambiguous-unicode-character-docstring"]
mccabe = { max-complexity = 12 }

[tool.ruff.lint.isort]
split-on-trailing-comma = false
no-lines-before = ["first-party", "third-party"]
section-order = [
  "future",
  "local-folder",
  "standard-library",
  "first-party",
  "third-party",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
xulbux = ["*.pyi", "**/*.pyi", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

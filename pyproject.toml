[build-system]
requires = [
  "setuptools>=80.0.0",
  "wheel>=0.45.0",
  "mypy>=1.19.0",
  "mypy-extensions>=1.1.0",
  # TYPES FOR MyPy
  "types-setuptools",
  "types-regex",
  "types-toml",
  "prompt_toolkit>=3.0.41",
]
build-backend = "setuptools.build_meta"

[project]
name = "xulbux"
version = "1.9.8"
description = "A Python library to simplify common programming tasks."
readme = "README.md"
authors = [{ name = "XulbuX", email = "xulbux.real@gmail.com" }]
maintainers = [{ name = "XulbuX", email = "xulbux.real@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10.0"
dependencies = ["prompt_toolkit>=3.0.41", "regex>=2023.10.3"]
optional-dependencies = { dev = [
  "flake8-pyproject>=1.2.3",
  "flake8>=6.1.0",
  "pyright>=1.1.408",
  "pytest>=7.4.2",
  "toml>=0.10.2",
] }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "args",
  "arguments",
  "attributes",
  "classes",
  "client",
  "cmd",
  "code",
  "codes",
  "color",
  "commands",
  "console",
  "constants",
  "consts",
  "conversion",
  "convert",
  "data",
  "debug",
  "easier",
  "env",
  "environment",
  "error",
  "file",
  "format",
  "formatting",
  "functions",
  "helper",
  "hex",
  "hexa",
  "hsl",
  "hsla",
  "info",
  "input",
  "json",
  "library",
  "log",
  "logging",
  "methods",
  "nice",
  "operations",
  "path",
  "presets",
  "pretty",
  "printing",
  "properties",
  "python",
  "re",
  "regex",
  "rgb",
  "rgba",
  "string",
  "structures",
  "system",
  "tools",
  "types",
  "utility",
  "warn",
  "warning",
  "xulbux",
]

[project.urls]
"Homepage" = "https://github.com/xulbux/python-lib-xulbux"
"Documentation" = "https://github.com/xulbux/python-lib-xulbux/wiki"
"Source Code" = "https://github.com/xulbux/python-lib-xulbux/tree/main/src"
"Changelog" = "https://github.com/xulbux/python-lib-xulbux/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/xulbux/python-lib-xulbux/issues"
"Stats" = "https://clickpy.clickhouse.com/dashboard/xulbux"
"License" = "https://github.com/xulbux/python-lib-xulbux/blob/main/LICENSE"

[project.scripts]
xulbux-lib = "xulbux.cli:main"

[tool.flake8]
max-complexity = 12
max-line-length = 127
select = ["E", "F", "W", "C90"]
extend-ignore = ["E124", "E203", "E266", "E502", "W503"]
per-file-ignores = [
  "__init__.py:F403,F405",
  "src/xulbux/base/types.py:E302,E305",
  "src/xulbux/cli/help.py:E501",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xulbux = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests/test_*.py"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportPrivateUsage = "none"

# This workflow will install Python dependencies, run tests and lint with all supported Python versions.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install ruff pyright pytest

      - name: Validate code with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check with PyRight
        run: |
          python -m pyright

      - name: Test with PyTest
        run: |
          python -m pytest --verbose
